<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff4e6">
<title>グミログ</title>
<meta name="description" content="グミレビューの Instagram 投稿文をステップ入力で作るツール">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="グミログ">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/favicon.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff4e6;
  --paper:#fffaf3;
  --ink:#3a2a2a;
  --ink-soft:#8a6f6f;
  --line:#f1dcc6;
  --berry:#ff4f79;
  --berry-deep:#e2325f;
  --lemon:#ffd14f;
  --lime:#7fd66a;
  --soda:#5cc8ff;
  --grape:#a77bff;
  --star:#ffb020;
  --star-off:#ead9c6;
  --radius:26px;
  --shadow:0 12px 34px rgba(120,60,30,.12);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 12% 8%, rgba(255,79,121,.18) 0 120px, transparent 121px),
    radial-gradient(circle at 92% 18%, rgba(92,200,255,.20) 0 90px, transparent 91px),
    radial-gradient(circle at 80% 90%, rgba(255,209,79,.28) 0 140px, transparent 141px),
    radial-gradient(circle at 8% 80%, rgba(127,214,106,.18) 0 100px, transparent 101px),
    var(--bg);
  display:flex;flex-direction:column;min-height:100dvh;
  -webkit-tap-highlight-color:transparent;overflow:hidden;
}
header{
  padding:calc(14px + env(safe-area-inset-top)) 20px 6px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
h1{
  margin:0;font-size:24px;font-weight:900;letter-spacing:.04em;
  background:linear-gradient(90deg,var(--berry),var(--grape));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.counter{font-family:"Kiwi Maru",serif;color:var(--ink-soft);font-size:14px;font-variant-numeric:tabular-nums}
.counter b{color:var(--ink);font-size:20px}

.progress{display:flex;gap:5px;padding:6px 20px 10px}
.progress i{
  flex:1;height:6px;border-radius:3px;background:#f3e2cf;cursor:pointer;position:relative;
  transition:background .25s;
}
.progress i.done{background:var(--lime)}
.progress i.now{background:var(--berry)}
.progress i.now::after{
  content:"";position:absolute;inset:-4px;border-radius:8px;border:2px solid rgba(255,79,121,.35);
}

.stage{flex:1;position:relative;padding:8px 16px 0;min-height:0}
.step{
  position:absolute;inset:8px 16px 0;display:flex;flex-direction:column;
  background:var(--paper);border-radius:var(--radius) var(--radius) 0 0;
  box-shadow:var(--shadow);border:1.5px solid #fff;border-bottom:0;
  padding:26px 22px 22px;
  opacity:0;pointer-events:none;
  transform:translateX(60px) scale(.98);
  transition:opacity .28s,transform .32s cubic-bezier(.2,.8,.2,1);
}
.step.back{transform:translateX(-60px) scale(.98)}
.step.active{opacity:1;pointer-events:auto;transform:none}
.step .q{margin:0;font-size:26px;font-weight:900;letter-spacing:.02em;line-height:1.3}
.step .q em{
  font-style:normal;display:inline-block;padding:0 .35em;border-radius:12px;
  background:linear-gradient(transparent 55%, var(--lemon) 55%);
}
.step .hint{margin:8px 0 0;color:var(--ink-soft);font-size:14px;font-family:"Kiwi Maru",serif}
.step .body{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.step .body > *{flex-shrink:0}
.step .body > :first-child{margin-top:auto}
.step .body > :last-child{margin-bottom:auto}
.preview-step .body > :first-child{margin-top:0}
.preview-step .body > :last-child{margin-bottom:0}

input[type=text],textarea{
  width:100%;font:inherit;color:var(--ink);
  background:#fff;border:2px solid var(--line);border-radius:18px;
  padding:16px;outline:none;transition:border-color .15s,box-shadow .15s;
}
input[type=text]:focus,textarea:focus{border-color:var(--berry);box-shadow:0 0 0 4px rgba(255,79,121,.15)}
.name-wrap{position:relative}
.name-wrap::before,.name-wrap::after{
  position:absolute;top:50%;transform:translateY(-52%);
  font-size:30px;font-weight:900;color:var(--berry);pointer-events:none;
}
.name-wrap::before{content:"「";left:12px}
.name-wrap::after{content:"」";right:12px}
.name-wrap input{padding:18px 44px;font-size:22px;font-weight:700;text-align:center}
textarea{font-size:18px;line-height:1.7;resize:none;min-height:180px}

.scan-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.scan-btn{
  all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  min-width:0;padding:14px 6px;border-radius:16px;font-weight:700;font-size:14px;
  background:#fff;border:2px dashed var(--grape);color:#6a44c9;transition:transform .1s,background .15s;
}
.scan-btn:active{transform:scale(.98);background:#f4eeff}
.scan-btn:disabled{opacity:.5;pointer-events:none}
.scan-status{margin-top:12px;font-size:14px;color:var(--ink-soft);font-family:"Kiwi Maru",serif;display:flex;align-items:center;gap:10px}
.scan-status[hidden]{display:none}
.scan-status img{width:48px;height:48px;object-fit:cover;border-radius:10px;border:2px solid var(--line)}
.scan-status .bar{flex:1;height:6px;border-radius:3px;background:#f3e2cf;overflow:hidden;padding:0;border:0;display:block}
.scan-status .bar i{display:block;height:100%;background:var(--grape);transition:width .2s}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips button{
  all:unset;cursor:pointer;padding:10px 14px;border-radius:999px;font-weight:700;font-size:15px;
  background:#fff;border:2px solid var(--line);transition:background .15s,border-color .15s,transform .1s;
}
.chips button:active{transform:scale(.96)}
.chips button.on{background:var(--lemon);border-color:var(--lemon)}
.chips .tip{width:100%;font-size:12px;color:var(--ink-soft);font-family:"Kiwi Maru",serif}
.chips .fulltext{width:100%;margin-top:4px}
.chips .fulltext summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-soft)}
.chips .fulltext pre{
  margin:8px 0 0;padding:12px;border-radius:14px;background:#fff;border:2px solid var(--line);
  font:inherit;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-all;user-select:text;-webkit-user-select:text;
}

.big-stars{display:flex;justify-content:space-between;gap:4px}
.big-stars button{
  all:unset;cursor:pointer;flex:1;aspect-ratio:1;display:grid;place-items:center;
  font-size:54px;line-height:1;color:var(--star-off);
  transition:transform .14s cubic-bezier(.34,1.56,.64,1),color .12s;
}
.big-stars button.on{color:var(--star);text-shadow:0 3px 0 rgba(180,110,0,.25)}
.big-stars button:active{transform:scale(1.25)}
.star-label{
  text-align:center;margin-top:18px;font-size:22px;font-weight:900;min-height:1.4em;
  color:var(--berry-deep);
}
.star-value{
  display:flex;justify-content:space-between;padding:0 8px;margin-top:8px;color:var(--ink-soft);
  font-family:"Kiwi Maru",serif;font-size:14px;
}

.score-num{
  display:flex;align-items:baseline;justify-content:center;gap:8px;
  font-size:88px;font-weight:900;line-height:1;letter-spacing:-.03em;
}
.score-num small{font-size:22px;color:var(--ink-soft);font-weight:700}
.stepper{display:flex;justify-content:center;gap:18px;margin-top:26px}
.stepper button{
  all:unset;cursor:pointer;width:72px;height:72px;border-radius:50%;
  display:grid;place-items:center;font-size:36px;font-weight:900;color:#fff;
  background:var(--berry);box-shadow:0 6px 0 var(--berry-deep);
  transition:transform .08s,box-shadow .08s;
}
.stepper button:active{transform:translateY(5px);box-shadow:0 1px 0 var(--berry-deep)}
.stepper button.minus{background:var(--soda);box-shadow:0 6px 0 #2e9fd8}
.stepper button.minus:active{box-shadow:0 1px 0 #2e9fd8}
input[type=range]{width:100%;margin:26px 0 0;accent-color:var(--berry);height:32px}

.choice{display:grid;gap:14px}
.choice button{
  all:unset;cursor:pointer;padding:24px;border-radius:22px;text-align:center;
  font-size:24px;font-weight:900;background:#fff;border:2.5px solid var(--line);
  transition:transform .1s,border-color .15s,background .15s;
}
.choice button:active{transform:scale(.97)}
.choice button.yes.on{background:var(--lime);border-color:var(--lime);color:#1d4a12}
.choice button.no.on{background:#ddd;border-color:#ddd;color:#333}

.preview-step{background:var(--ink);color:#fff8ee;border-color:var(--ink)}
.preview-step .q{color:#fff}
.preview-step .q em{background:linear-gradient(transparent 55%, rgba(255,209,79,.45) 55%)}
.preview-step .body{margin-top:14px;padding-bottom:8px}
.preview-step pre{
  margin:0;font:inherit;font-size:15px;line-height:1.75;white-space:pre-wrap;word-break:break-all;
  user-select:all;-webkit-user-select:all;
}
.preview-step .count{margin-top:8px;font-size:12px;color:#b89e84;text-align:right;font-family:"Kiwi Maru",serif}
.preview-step details{margin-top:14px;border-top:1px dashed #6a5555;padding-top:12px}
.preview-step summary{cursor:pointer;font-size:13px;color:#d9c2a8;letter-spacing:.1em;font-weight:700}
.preview-step details .fields{display:grid;gap:10px;margin-top:10px}
.preview-step textarea{background:#4a3838;border-color:#5f4a4a;color:#fff8ee;font-size:15px;min-height:64px;padding:12px}

.bar{
  padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  display:flex;gap:10px;background:var(--paper);
  border-top:1px solid #fff;
}
.bar button{
  all:unset;cursor:pointer;text-align:center;padding:16px;border-radius:999px;
  font-weight:900;font-size:17px;letter-spacing:.06em;white-space:nowrap;
  transition:transform .08s,box-shadow .08s,opacity .15s;
}
.bar button:disabled{opacity:.35;pointer-events:none}
.bar button[hidden]{display:none}
.bar .prev{flex:0 0 auto;padding:16px 22px;background:#fff;color:var(--ink);box-shadow:0 6px 0 var(--line)}
.bar .prev:active{transform:translateY(5px);box-shadow:0 1px 0 var(--line)}
.bar .next{flex:1;background:var(--berry);color:#fff;box-shadow:0 6px 0 var(--berry-deep)}
.bar .next:active{transform:translateY(5px);box-shadow:0 1px 0 var(--berry-deep)}
.bar .next.finish{background:var(--lime);color:#1d4a12;box-shadow:0 6px 0 #5aae48}
.bar .share{flex:0 0 auto;padding:16px 20px;background:#fff;color:var(--ink);box-shadow:0 6px 0 var(--line)}
.bar .share:active{transform:translateY(5px);box-shadow:0 1px 0 var(--line)}
.bar .reset{flex:0 0 auto;background:transparent;color:var(--ink-soft);font-size:13px;font-weight:700;padding:16px 4px}

.toast{
  position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-10px);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header>
  <h1>グミログ</h1>
  <div class="counter"><b id="stepNow">1</b> / <span id="stepTotal">9</span></div>
</header>
<div class="progress" id="progress"></div>

<div class="stage" id="stage">
  <section class="step" data-step="name">
    <h2 class="q">どの<em>グミ</em>を食べた？</h2>
    <p class="hint">商品名を入力（「」は自動でつきます）</p>
    <div class="body">
      <div class="name-wrap"><input type="text" id="name" placeholder="商品名" autocomplete="off" enterkeyhint="next"></div>
      <div class="scan-row">
        <button class="scan-btn" data-source="camera">📷 カメラで撮る</button>
        <button class="scan-btn" data-source="album">🖼 アルバムから</button>
      </div>
      <input type="file" id="scanCamera" accept="image/*" capture="environment" hidden>
      <input type="file" id="scanAlbum" accept="image/*" hidden>
      <div class="scan-status" id="scanStatus" hidden></div>
      <div class="chips" id="scanChips"></div>
    </div>
  </section>

  <!-- star steps are generated -->

  <section class="step" data-step="score">
    <h2 class="q"><em>総合評価</em>は？</h2>
    <p class="hint">0.5 きざみ・10点満点</p>
    <div class="body">
      <div class="score-num"><span id="scoreText">8.0</span><small>/ 10</small></div>
      <div class="stepper">
        <button class="minus" data-step="-0.5" aria-label="0.5下げる">−</button>
        <button data-step="0.5" aria-label="0.5上げる">＋</button>
      </div>
      <input type="range" id="score" min="0" max="10" step="0.5" value="8">
    </div>
  </section>

  <section class="step" data-step="repeat">
    <h2 class="q">また<em>買う</em>？</h2>
    <p class="hint">リピートしたいかどうか</p>
    <div class="body">
      <div class="choice" id="repeat">
        <button class="yes" data-v="あり">🔁 リピートあり</button>
        <button class="no" data-v="なし">😌 リピートなし</button>
      </div>
    </div>
  </section>

  <section class="step" data-step="comment">
    <h2 class="q">💬 <em>ひとこと</em></h2>
    <p class="hint">感想を自由に</p>
    <div class="body">
      <textarea id="comment" placeholder="SNSでバズってなかなか買えなかった一品。かなり硬い。"></textarea>
    </div>
  </section>

  <section class="step preview-step" data-step="done">
    <h2 class="q">🍬 <em>できあがり</em></h2>
    <div class="body">
      <pre id="out"></pre>
      <div class="count"><span id="count">0</span> / 2200</div>
      <details>
        <summary>定型文・ハッシュタグを編集</summary>
        <div class="fields">
          <textarea id="footer" rows="2"></textarea>
          <textarea id="tags" rows="2"></textarea>
        </div>
      </details>
    </div>
  </section>
</div>

<div class="bar">
  <button class="prev" id="prev">←</button>
  <button class="next" id="next">次へ →</button>
  <button class="share" id="share" hidden>共有</button>
  <button class="reset" id="reset" hidden>クリア</button>
</div>
<div class="toast" id="toast"></div>

<script>
const AXES = ["硬さ","弾力","酸っぱさ","味の濃さ","中毒性"];
const STAR_WORDS = {
  "硬さ":["やわやわ","やわらかめ","ふつう","かため","ガチガチ"],
  "弾力":["ほぼなし","ひかえめ","ふつう","もちもち","超もちもち"],
  "酸っぱさ":["甘い","ほんのり","ふつう","すっぱい","激すっぱ"],
  "味の濃さ":["うすい","ひかえめ","ふつう","しっかり","濃厚"],
  "中毒性":["一粒で満足","たまに","ふつう","止まらない","やみつき"],
};
const DEFAULTS = {
  name:"", stars:[0,0,0,0,0], score:8, repeat:"", comment:"",
  footer:"みんなのおすすめグミも教えてください。",
  tags:"#グミ #グミレビュー #グミ好き #お菓子 #お菓子レビュー",
};
const KEY = "gumi-log-editor:v1";
let state = load();
let idx = 0;

function load(){
  try{ return {...DEFAULTS, ...JSON.parse(localStorage.getItem(KEY) || "{}")}; }
  catch{ return {...DEFAULTS}; }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch{} }

function pad(label){ return label + "　".repeat(Math.max(0, 4 - label.length)); }
function starLine(n){ return "★".repeat(n) + "☆".repeat(5 - n); }
function format(s){
  return [
    `「${s.name}」`,
    "",
    ...AXES.map((a,i) => pad(a) + starLine(s.stars[i])),
    "",
    `👑 総合評価：${s.score.toFixed(1)} / 10`,
    `🔁 リピート：${s.repeat}`,
    "",
    "💬ひとこと",
    s.comment,
    "",
    s.footer,
    "",
    s.tags,
  ].join("\n");
}

const $ = id => document.getElementById(id);
const stage = $("stage");
const scoreStep = stage.querySelector('[data-step="score"]');
AXES.forEach((a,i) => {
  const sec = document.createElement("section");
  sec.className = "step"; sec.dataset.step = "star"; sec.dataset.axis = i;
  sec.innerHTML = `
    <h2 class="q"><em>${a}</em>は？</h2>
    <p class="hint">星をタップ（タップで次へ進みます）</p>
    <div class="body">
      <div class="big-stars">${[1,2,3,4,5].map(n => `<button data-n="${n}" aria-label="${a} ${n}">★</button>`).join("")}</div>
      <div class="star-label"></div>
      <div class="star-value"><span>${STAR_WORDS[a][0]}</span><span>${STAR_WORDS[a][4]}</span></div>
    </div>`;
  stage.insertBefore(sec, scoreStep);
});
const steps = [...stage.querySelectorAll(".step")];
const inputSteps = steps.length - 1;
$("stepTotal").textContent = inputSteps;
const progress = $("progress");
steps.slice(0, inputSteps).forEach((_,i) => {
  const dot = document.createElement("i"); dot.dataset.i = i;
  dot.addEventListener("click", () => go(i)); progress.appendChild(dot);
});

function isFilled(i){
  const s = steps[i];
  switch(s.dataset.step){
    case "name": return state.name.trim() !== "";
    case "star": return state.stars[+s.dataset.axis] > 0;
    case "repeat": return state.repeat !== "";
    default: return true;
  }
}
function go(n, dir){
  if(n < 0 || n >= steps.length) return;
  dir = dir ?? (n < idx ? "back" : "fwd");
  steps[idx].classList.remove("active");
  steps[idx].classList.toggle("back", dir === "fwd");
  idx = n;
  const s = steps[idx];
  s.classList.remove("back"); s.classList.add("active");
  const focusable = s.querySelector("input[type=text],textarea");
  if(focusable) setTimeout(() => focusable.focus({preventScroll:true}), 320);
  render();
}
const advance = () => setTimeout(() => go(idx + 1, "fwd"), 380);

stage.addEventListener("click", e => {
  const b = e.target.closest(".big-stars button");
  if(!b) return;
  const axis = +b.closest(".step").dataset.axis;
  const was = state.stars[axis];
  state.stars[axis] = +b.dataset.n; render();
  if(was === 0) advance();
});
$("repeat").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  const was = state.repeat;
  state.repeat = b.dataset.v; render();
  if(was === "") advance();
});
$("name").addEventListener("input", e => { state.name = e.target.value; ocrPicked = []; renderChips(); render(); });
$("name").addEventListener("keydown", e => { if(e.key === "Enter" && isFilled(idx)){ e.preventDefault(); go(idx+1); } });
$("comment").addEventListener("input", e => { state.comment = e.target.value; render(); });
$("footer").addEventListener("input", e => { state.footer = e.target.value; render(); });
$("tags").addEventListener("input", e => { state.tags = e.target.value; render(); });
$("score").addEventListener("input", e => { state.score = +e.target.value; render(); });
document.querySelectorAll(".stepper button").forEach(b => b.addEventListener("click", () => {
  state.score = Math.min(10, Math.max(0, state.score + +b.dataset.step)); render();
}));

const VENDOR = new URL("./vendor/", location.href).href;
const TESSERACT_URL = VENDOR + "tesseract/tesseract.min.js";
const OCR_STATUS = {
  "loading tesseract core":"OCR エンジンを準備中", "initializing tesseract":"OCR エンジンを準備中",
  "loading language traineddata":"日本語データを読み込み中（初回のみ）", "initialized api":"準備完了",
  "recognizing text":"文字を読み取り中",
};
let ocrWorker, ocrChips = [], ocrPicked = [], ocrFullText = "";

function loadScript(src){
  return new Promise((ok, ng) => {
    if(window.Tesseract) return ok();
    const el = document.createElement("script"); el.src = src; el.onload = ok;
    el.onerror = () => ng(new Error("script")); document.head.appendChild(el);
  });
}
async function getOcrWorker(onProgress){
  if(ocrWorker) return ocrWorker;
  await loadScript(TESSERACT_URL);
  ocrWorker = await Tesseract.createWorker("jpn", 1, {
    workerPath: VENDOR + "tesseract/worker.min.js",
    corePath: VENDOR + "tesseract",
    langPath: VENDOR + "tessdata",
    logger: onProgress,
  });
  return ocrWorker;
}
function fileToCanvas(file){
  return new Promise((ok, ng) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
      const ctx = c.getContext("2d");
      ctx.filter = "grayscale(1) contrast(1.25)";
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); ng(new Error("image")); };
    img.src = url;
  });
}
const OCR_SCALES = [1200, 800, 500];
function scaleCanvas(src, max){
  const s = Math.min(1, max / Math.max(src.width, src.height));
  const c = document.createElement("canvas");
  c.width = Math.round(src.width * s); c.height = Math.round(src.height * s);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  return c;
}
async function recognizeMultiScale(worker, canvas, onPass){
  const found = new Map();
  let fullText = "", bestConf = -1;
  for(const [i, max] of OCR_SCALES.entries()){
    onPass(i + 1, OCR_SCALES.length);
    const scaled = scaleCanvas(canvas, max);
    const { data } = await worker.recognize(scaled);
    if(data.confidence > bestConf){ bestConf = data.confidence; fullText = data.text || ""; }
    for(const l of data.lines || []){
      const text = l.text.replace(/\s+/g, "");
      if(!text) continue;
      const score = l.confidence * ((l.bbox.y1 - l.bbox.y0) / scaled.height);
      const prev = found.get(text);
      if(!prev || prev.conf < l.confidence) found.set(text, { text, conf: l.confidence, score });
    }
  }
  return { lines: [...found.values()], fullText };
}
function pickCandidates(lines){
  return lines.sort((a, b) => b.score - a.score).map(c => c.text);
}
function showScanStatus(html){ const el = $("scanStatus"); el.hidden = false; el.innerHTML = html; }
function renderChips(){
  const box = $("scanChips");
  box.innerHTML = ocrChips.length
    ? ocrChips.map((t, i) => `<button data-i="${i}" class="${ocrPicked.includes(i) ? "on" : ""}">${t.replace(/</g, "&lt;")}</button>`).join("")
      + `<div class="tip">タップで商品名に入れます。複数タップするとつながります</div>`
      + `<details class="fulltext"><summary>読み取った文字を全部見る</summary><pre>${ocrFullText.replace(/</g, "&lt;")}</pre></details>`
    : "";
}
$("scanChips").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  const i = +b.dataset.i;
  ocrPicked = ocrPicked.includes(i) ? ocrPicked.filter(x => x !== i) : [...ocrPicked, i];
  state.name = ocrPicked.map(x => ocrChips[x]).join("");
  renderChips(); render();
});
const scanButtons = [...document.querySelectorAll(".scan-btn")];
document.querySelector(".scan-row").addEventListener("click", e => {
  const b = e.target.closest(".scan-btn"); if(!b) return;
  $(b.dataset.source === "camera" ? "scanCamera" : "scanAlbum").click();
});
["scanCamera", "scanAlbum"].forEach(id => $(id).addEventListener("change", runOcr));
async function runOcr(e){
  const file = e.target.files[0]; e.target.value = "";
  if(!file) return;
  scanButtons.forEach(b => b.disabled = true);
  ocrChips = []; ocrPicked = []; ocrFullText = ""; renderChips();
  let thumb = "";
  try{
    const canvas = await fileToCanvas(file);
    thumb = `<img src="${canvas.toDataURL("image/jpeg", .6)}" alt="">`;
    let pass = "";
    const progress = m => {
      const label = (OCR_STATUS[m.status] || "準備中") + (m.status === "recognizing text" ? pass : "");
      const pct = Math.round((m.progress || 0) * 100);
      showScanStatus(`${thumb}<span>${label}</span><span class="bar"><i style="width:${pct}%"></i></span>`);
    };
    progress({ status: "loading tesseract core", progress: 0 });
    const worker = await getOcrWorker(progress);
    const { lines, fullText } = await recognizeMultiScale(worker, canvas, (i, n) => { pass = `（${i}/${n}）`; });
    ocrChips = pickCandidates(lines);
    ocrFullText = fullText.trim();
    renderChips();
    showScanStatus(ocrChips.length
      ? `${thumb}<span>読み取れた候補です。商品名をタップしてください</span>`
      : `${thumb}<span>文字を読み取れませんでした。明るい場所で正面から撮るか、手で入力してください</span>`);
  }catch(err){
    showScanStatus(`${thumb}<span>読み取りに失敗しました。通信環境を確認するか、手で入力してください</span>`);
  }finally{
    scanButtons.forEach(b => b.disabled = false);
  }
}

$("prev").addEventListener("click", () => go(idx - 1, "back"));
$("next").addEventListener("click", async () => {
  if(idx < steps.length - 1){ go(idx + 1, "fwd"); return; }
  const text = format(state);
  try{ await navigator.clipboard.writeText(text); }
  catch{
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }
  toast("コピーしました 🍬 Instagramに貼り付けてね");
});
$("reset").addEventListener("click", () => {
  state = {...DEFAULTS, stars:[...DEFAULTS.stars]}; go(0, "back");
});
if(navigator.share){
  $("share").addEventListener("click", () => navigator.share({text: format(state)}).catch(() => {}));
}
let toastTimer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

function render(){
  const s = steps[idx];
  const last = idx === steps.length - 1;
  $("stepNow").textContent = Math.min(idx + 1, inputSteps);
  progress.querySelectorAll("i").forEach((d,i) => {
    d.classList.toggle("now", i === idx && !last);
    d.classList.toggle("done", (i < idx || last) && isFilled(i));
  });
  $("prev").disabled = idx === 0;
  const next = $("next");
  next.disabled = !isFilled(idx);
  next.classList.toggle("finish", last);
  next.textContent = last ? "📋 コピー" : idx === steps.length - 2 ? "できあがり →" : "次へ →";
  $("share").hidden = !(last && navigator.share);
  $("reset").hidden = !last;

  $("name").value = state.name;
  $("comment").value = state.comment;
  $("footer").value = state.footer;
  $("tags").value = state.tags;
  $("score").value = state.score;
  $("scoreText").textContent = state.score.toFixed(1);
  steps.filter(x => x.dataset.step === "star").forEach(sec => {
    const axis = +sec.dataset.axis, v = state.stars[axis];
    sec.querySelectorAll(".big-stars button").forEach(b => b.classList.toggle("on", +b.dataset.n <= v));
    sec.querySelector(".star-label").textContent = v ? STAR_WORDS[AXES[axis]][v-1] : "";
  });
  document.querySelectorAll("#repeat button").forEach(b => b.classList.toggle("on", b.dataset.v === state.repeat));
  const text = format(state);
  $("out").textContent = text;
  $("count").textContent = [...text].length;
  save();
}
steps[0].classList.add("active");
render();
if("serviceWorker" in navigator){
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.update().catch(() => {})));
}
</script>
